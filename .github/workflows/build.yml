name: CI, Build, and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run Pytest
        run: uv run --all-groups pytest -s

  build:
    name: Build for ${{ matrix.platform }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            extension: ""
          - os: windows-latest
            platform: windows
            extension: ".exe"
          - os: macos-latest
            platform: macos
            extension: ""
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build with PyInstaller
        run: >
          uv run pyinstaller
          --onefile
          --name fcm-receiver-${{ matrix.platform }}${{ matrix.extension }}
          src/fcm_console_receiver/show_notifications.py
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.platform }}
          path: dist/fcm-receiver-${{ matrix.platform }}${{ matrix.extension }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v6
        with:
          path: all-binaries
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-binaries/*
          generate_release_notes: true
